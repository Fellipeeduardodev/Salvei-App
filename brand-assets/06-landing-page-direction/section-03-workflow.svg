<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" width="1440" height="700" fill="none">
<g id="section-03-workflow">
  <rect width="1440" height="700" fill="#F8F8F6"/>
  <line x1="0" y1="0" x2="1440" y2="0" stroke="#E7E7E5"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .wf-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #4355DB; letter-spacing: 0.16em; text-transform: uppercase; }
    .wf-h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 38px; fill: #171717; letter-spacing: -0.03em; }
    .step-num { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 54px; fill: #4355DB; letter-spacing: -0.04em; }
    .step-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 20px; fill: #171717; }
    .step-body { font-family: 'Inter', sans-serif; font-size: 14px; fill: #737373; line-height: 1.6; }
  </style>

  <g transform="translate(120, 80)">
    <text class="wf-tag">FLUXO OPERACIONAL ESSENCIAL</text>
    <text y="42" class="wf-h2">Simples de capturar. Impossível de esquecer.</text>
  </g>

  <!-- 3 Steps Grid -->
  <g transform="translate(120, 200)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect width="380" height="420" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
      <g transform="translate(32, 40)">
        <text class="step-num">01</text>
        <text y="50" class="step-title">Salvar</text>
        <text y="84" class="step-body">Cole uma URL ou jogue imagens diretamente com Ctrl+V ou drag-and-drop. O Salvei extrai o título, screenshot e domínio em segundos.</text>
        
        <!-- Illustration Box -->
        <g transform="translate(0, 160)">
          <rect width="316" height="150" rx="6" fill="#F8F8F6" stroke="#E7E7E5"/>
          <rect x="20" y="24" width="276" height="34" rx="6" fill="#FFFFFF" stroke="#E7E7E5"/>
          <circle cx="38" cy="41" r="5" fill="#4355DB"/>
          <text x="52" y="45" style="font-family:'JetBrains Mono';font-size:11px;fill:#171717">https://stripe.com</text>
          <rect x="20" y="74" width="130" height="46" rx="4" fill="#4355DB" fill-opacity="0.1"/>
          <text x="85" y="102" text-anchor="middle" style="font-family:'Inter';font-weight:600;font-size:11px;fill:#4355DB">Paste Ctrl+V</text>
        </g>
      </g>
    </g>

    <!-- Step 2 -->
    <g transform="translate(410, 0)">
      <rect width="380" height="420" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
      <g transform="translate(32, 40)">
        <text class="step-num">02</text>
        <text y="50" class="step-title">Organizar</text>
        <text y="84" class="step-body">Agrupe referências em torno de entregas específicas com Projetos, crie Coleções com mosaicos estéticos e use etiquetas taxonômicas livres.</text>
        
        <g transform="translate(0, 160)">
          <rect width="316" height="150" rx="6" fill="#F8F8F6" stroke="#E7E7E5"/>
          <g transform="translate(20, 24)">
            <rect width="276" height="30" rx="4" fill="#FFFFFF" stroke="#E7E7E5"/>
            <text x="14" y="20" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:12px;fill:#171717">Projeto: Redesign App 2026</text>
            <rect y="42" width="132" height="26" rx="13" fill="#4355DB"/>
            <text x="66" y="58" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#FFFFFF">#dark-mode</text>
            <rect x="144" y="42" width="132" height="26" rx="13" fill="#FFFFFF" stroke="#E7E7E5"/>
            <text x="210" y="58" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#171717">#tipografia</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Step 3 -->
    <g transform="translate(820, 0)">
      <rect width="380" height="420" rx="12" fill="#FFFFFF" stroke="#4355DB" stroke-width="1.5"/>
      <g transform="translate(32, 40)">
        <text class="step-num">03</text>
        <text y="50" class="step-title">Encontrar</text>
        <text y="84" class="step-body">Pressione [ / ] ou [ Cmd + K ] para busca rápida instantânea. Filtre por mídias, tags ou favoritos sem recarregar a tela ou perder o foco.</text>
        
        <g transform="translate(0, 160)">
          <rect width="316" height="150" rx="6" fill="#171717"/>
          <g transform="translate(20, 24)">
            <rect width="276" height="32" rx="4" fill="#20232A"/>
            <text x="14" y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#FFFFFF">Cmd + K • Quick Search</text>
            <rect y="44" width="276" height="56" rx="4" fill="#282C35"/>
            <text x="14" y="66" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:11px;fill:#FFFFFF">Linear Brand Workspace</text>
            <text x="14" y="84" style="font-family:'JetBrains Mono';font-size:9px;fill:#6375F1">Abrir referência ↵</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</g>
</svg>