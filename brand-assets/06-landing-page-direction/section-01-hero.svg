<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" fill="none">
<g id="section-01-hero">
  <rect width="1440" height="900" fill="#F8F8F6"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .nav-link { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; fill: #737373; }
    .hero-h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 64px; fill: #171717; letter-spacing: -0.04em; line-height: 1.05; text-anchor: middle; }
    .hero-p { font-family: 'Inter', sans-serif; font-size: 18px; fill: #737373; line-height: 1.5; text-anchor: middle; }
    .btn-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
  </style>

  <!-- Top Nav -->
  <g transform="translate(60, 32)">
    <g transform="translate(0, 0)">
      <rect width="28" height="28" rx="6" fill="#171717"/>
      <circle cx="19" cy="9" r="1.8" fill="#4355DB"/>
      <path d="M 18 11 C 18 9 16 8 14 8 C 11 8 9 10 9 12 C 9 15 13 16 15 17 C 18 18 20 20 20 22 C 20 24 17 25 13 25 C 10 25 9 23 9 21" 
            stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="21" style="font-family:'Plus Jakarta Sans';font-weight:800;font-size:22px;letter-spacing:-0.04em;fill:#171717">salve<tspan>ı</tspan></text>
      <circle cx="94" cy="8" r="2.5" fill="#4355DB"/>
    </g>

    <g transform="translate(560, 8)">
      <text x="0" y="12" class="nav-link">Recursos</text>
      <text x="80" y="12" class="nav-link">Manifesto</text>
      <text x="170" y="12" class="nav-link">Atalhos</text>
      <text x="250" y="12" class="nav-link">GitHub</text>
    </g>

    <!-- Nav Right CTA -->
    <g transform="translate(1180, 0)">
      <rect width="140" height="36" rx="6" fill="#171717"/>
      <text x="70" y="22" class="btn-text" font-size="12px">Acessar App →</text>
    </g>
  </g>

  <!-- Hero Headline -->
  <g transform="translate(720, 150)">
    <!-- Pill Tag -->
    <rect x="-140" y="0" width="280" height="28" rx="14" fill="#FFFFFF" stroke="#E7E7E5"/>
    <circle cx="-120" cy="14" r="3.5" fill="#4355DB"/>
    <text x="0" y="18" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:11px;font-weight:600;fill:#171717;letter-spacing:0.12em">WORKSPACE DIGITAL DE REFERÊNCIAS</text>

    <!-- H1 -->
    <text y="70" class="hero-h1">Salve, organize e encontre</text>
    <text y="140" class="hero-h1">suas referências de design.</text>

    <!-- Subtitle -->
    <text y="196" class="hero-p">A biblioteca visual de alta precisão para designers e desenvolvedores.</text>
    <text y="222" class="hero-p">Reúna sites, capturas, interfaces e códigos em um ateliê privado.</text>

    <!-- CTA Button -->
    <g transform="translate(-110, 256)">
      <rect width="220" height="48" rx="8" fill="#4355DB"/>
      <text x="110" y="29" class="btn-text">Começar Gratuitamente</text>
    </g>
    <text y="326" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:11px;fill:#737373">100% Gratuito • Sem cartão • Nuvem Supabase</text>
  </g>

  <!-- Hero Desktop Mockup Teaser (peeking from bottom) -->
  <g transform="translate(120, 520)">
    <rect width="1200" height="380" rx="14" fill="#FFFFFF" stroke="#E7E7E5" stroke-width="2"/>
    <!-- Mockup header -->
    <rect width="1200" height="42" rx="14" fill="#F8F8F6"/>
    <circle cx="24" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="40" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="21" r="5" fill="#27C93F"/>
    <rect x="300" y="8" width="600" height="26" rx="5" fill="#FFFFFF" stroke="#E7E7E5"/>
    <text x="600" y="25" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:11px;fill:#171717">https://salvei.tech/app</text>

    <!-- 3 Preview cards inside hero mockup -->
    <g transform="translate(24, 60)">
      <rect width="364" height="300" rx="6" fill="#F8F8F6" stroke="#E7E7E5"/>
      <image href="../04-image-assets/digital-references/digital-interface-grid-01.jpg" x="12" y="12" width="340" height="210" preserveAspectRatio="xMidYMid slice" rx="4"/>
      <text x="16" y="250" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">Linear Modern UI</text>
      <text x="16" y="270" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">linear.app</text>
    </g>

    <g transform="translate(418, 60)">
      <rect width="364" height="300" rx="6" fill="#F8F8F6" stroke="#E7E7E5"/>
      <image href="../04-image-assets/editorial-references/editorial-architecture-01.jpg" x="12" y="12" width="340" height="210" preserveAspectRatio="xMidYMid slice" rx="4"/>
      <text x="16" y="250" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">Kinfolk Architecture</text>
      <text x="16" y="270" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">kinfolk.com</text>
    </g>

    <g transform="translate(812, 60)">
      <rect width="364" height="300" rx="6" fill="#F8F8F6" stroke="#E7E7E5"/>
      <image href="../04-image-assets/hybrid-compositions/hybrid-studio-still-01.jpg" x="12" y="12" width="340" height="210" preserveAspectRatio="xMidYMid slice" rx="4"/>
      <text x="16" y="250" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">Swiss Design Specimen</text>
      <text x="16" y="270" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">are.na/fellipe</text>
    </g>
  </g>
</g>
</svg>