<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" width="1440" height="850" fill="none">
<g id="section-05-inspiration">
  <rect width="1440" height="850" fill="#F8F8F6"/>
  <line x1="0" y1="0" x2="1440" y2="0" stroke="#E7E7E5"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .insp-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #4355DB; letter-spacing: 0.16em; text-transform: uppercase; }
    .insp-h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 38px; fill: #171717; letter-spacing: -0.03em; }
    .insp-sub { font-family: 'Inter', sans-serif; font-size: 15px; fill: #737373; line-height: 1.6; }
  </style>

  <g transform="translate(120, 80)">
    <text class="insp-tag">CURADORIA MULTIDISCIPLINAR</text>
    <text y="42" class="insp-h2">Do código à arquitetura: eleve o nível visual do seu time.</text>
    <text y="74" class="insp-sub">O Salvei foi concebido como um museu digital pessoal. Interfaces, tipografias suíças, grids modulares e texturas no mesmo acervo.</text>
  </g>

  <!-- Masonry Gallery -->
  <g transform="translate(120, 190)">
    <!-- Column 1: Arch (Big) + Spec (Small) -->
    <g transform="translate(0, 0)">
      <!-- Item 1: Arch -->
      <g>
        <rect width="380" height="340" rx="10" fill="#FFFFFF" stroke="#E7E7E5"/>
        <image href="../04-image-assets/editorial-references/editorial-architecture-01.jpg" x="12" y="12" width="356" height="240" preserveAspectRatio="xMidYMid slice" rx="6"/>
        <g transform="translate(16, 276)">
          <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">Estudo Espacial &amp; Luz Suíça</text>
          <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">#arquitetura #espaco-negativo</text>
        </g>
      </g>
      <!-- Item 2: Spec below -->
      <g transform="translate(0, 360)">
        <rect width="380" height="230" rx="10" fill="#FFFFFF" stroke="#E7E7E5"/>
        <image href="../04-image-assets/digital-references/digital-design-system-spec-02.jpg" x="12" y="12" width="356" height="140" preserveAspectRatio="xMidYMid slice" rx="6"/>
        <g transform="translate(16, 176)">
          <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">Design Tokens &amp; Specimen</text>
          <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">#tokens #design-system #code</text>
        </g>
      </g>
    </g>

    <!-- Column 2: Digital Interface (Tall) -->
    <g transform="translate(410, 0)">
      <rect width="380" height="590" rx="10" fill="#FFFFFF" stroke="#E7E7E5"/>
      <image href="../04-image-assets/digital-references/digital-interface-grid-01.jpg" x="12" y="12" width="356" height="490" preserveAspectRatio="xMidYMid slice" rx="6"/>
      <g transform="translate(16, 526)">
        <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;fill:#171717">Workspace Grid &amp; Linear Architecture</text>
        <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">linear.app • #interface #dark-mode</text>
      </g>
    </g>

    <!-- Column 3: Typography (Small) + Studio Still (Big) -->
    <g transform="translate(820, 0)">
      <!-- Item 1: Typography -->
      <g>
        <rect width="380" height="230" rx="10" fill="#FFFFFF" stroke="#E7E7E5"/>
        <image href="../04-image-assets/editorial-references/editorial-typography-print-02.jpg" x="12" y="12" width="356" height="140" preserveAspectRatio="xMidYMid slice" rx="6"/>
        <g transform="translate(16, 176)">
          <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">Tipografia Impressa &amp; Tipos Móveis</text>
          <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">#editorial #tipografia #letterpress</text>
        </g>
      </g>
      <!-- Item 2: Studio Still below -->
      <g transform="translate(0, 250)">
        <rect width="380" height="340" rx="10" fill="#FFFFFF" stroke="#E7E7E5"/>
        <image href="../04-image-assets/hybrid-compositions/hybrid-studio-still-01.jpg" x="12" y="12" width="356" height="240" preserveAspectRatio="xMidYMid slice" rx="6"/>
        <g transform="translate(16, 276)">
          <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">Ateliê Criativo Híbrido</text>
          <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">#studio #setup #analog-digital</text>
        </g>
      </g>
    </g>
  </g>
</g>
</svg>