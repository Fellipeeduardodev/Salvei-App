<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800" fill="none">
<g id="section-04-features">
  <rect width="1440" height="800" fill="#FFFFFF"/>
  <line x1="0" y1="0" x2="1440" y2="0" stroke="#E7E7E5"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .feat-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #4355DB; letter-spacing: 0.16em; text-transform: uppercase; }
    .feat-h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 38px; fill: #171717; letter-spacing: -0.03em; }
    .feat-sub { font-family: 'Inter', sans-serif; font-size: 15px; fill: #737373; line-height: 1.6; }
    .fcard-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 18px; fill: #171717; }
    .fcard-desc { font-family: 'Inter', sans-serif; font-size: 13.5px; fill: #737373; line-height: 1.6; }
    .fcard-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #4355DB; }
  </style>

  <g transform="translate(120, 80)">
    <text class="feat-tag">RECURSOS PROJETADOS PARA QUEM CRIA</text>
    <text y="42" class="feat-h2">Ferramentas cirúrgicas para o fluxo diário.</text>
    <text y="74" class="feat-sub">Construído especificamente para as necessidades de quem desenha e codifica interfaces modernas.</text>
  </g>

  <!-- 4 Feature Cards (2x2) -->
  <g transform="translate(120, 200)">
    <!-- Feature 1: Captura Instantânea -->
    <g transform="translate(0, 0)">
      <rect width="580" height="240" rx="12" fill="#F8F8F6" stroke="#E7E7E5"/>
      <g transform="translate(36, 36)">
        <rect width="44" height="44" rx="10" fill="#171717"/>
        <!-- Link Icon -->
        <path d="M 17 25 L 21 21 C 23 19 26 19 28 21 C 30 23 30 26 28 28 L 24 32 C 22 34 19 34 17 32" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M 27 19 L 23 23 C 21 25 18 25 16 23 C 14 21 14 18 16 16 L 20 12 C 22 10 25 10 27 12" stroke="#6375F1" stroke-width="2.2" stroke-linecap="round"/>
        <text x="60" y="24" class="fcard-title">Captura por URL ou Clipboard</text>
        <text x="60" y="42" class="fcard-badge">OPEN GRAPH • METADADOS AUTOMÁTICOS</text>
        <text y="80" class="fcard-desc">
          Basta colar um link ou pressionar Ctrl+V com uma imagem copiada. O Salvei extrai automaticamente o título da página, preview de alta resolução, domínio e paleta de cores.
        </text>
      </g>
    </g>

    <!-- Feature 2: Projetos & Coleções -->
    <g transform="translate(620, 0)">
      <rect width="580" height="240" rx="12" fill="#F8F8F6" stroke="#E7E7E5"/>
      <g transform="translate(36, 36)">
        <rect width="44" height="44" rx="10" fill="#171717"/>
        <!-- Mosaic Folders Icon -->
        <rect x="14" y="14" width="10" height="10" rx="2" fill="#6375F1"/>
        <rect x="26" y="14" width="10" height="18" rx="2" fill="#FFFFFF"/>
        <rect x="14" y="26" width="10" height="10" rx="2" fill="#FFFFFF"/>
        <text x="60" y="24" class="fcard-title">Coleções &amp; Mosaicos Dinâmicos</text>
        <text x="60" y="42" class="fcard-badge">CURADORIA TEMÁTICA • MODO MASONRY</text>
        <text y="80" class="fcard-desc">
          Agrupe suas referências por projetos de clientes ou estudos estéticos. Visualize em mosaicos que respeitam a proporção original de cada print e mockup.
        </text>
      </g>
    </g>

    <!-- Feature 3: Taxonomia & Tags -->
    <g transform="translate(0, 270)">
      <rect width="580" height="240" rx="12" fill="#F8F8F6" stroke="#E7E7E5"/>
      <g transform="translate(36, 36)">
        <rect width="44" height="44" rx="10" fill="#171717"/>
        <!-- Tag Icon -->
        <circle cx="20" cy="20" r="3" fill="#6375F1"/>
        <path d="M 16 28 L 26 18 L 30 22 L 20 32 Z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
        <text x="60" y="24" class="fcard-title">Tags Transversais &amp; Notas Markdown</text>
        <text x="60" y="42" class="fcard-badge">NOTAS RICAS • CORES HEX • SNIPPETS</text>
        <text y="80" class="fcard-desc">
          Adicione notas editoriais, anote classes Tailwind ou guarde trechos de código CSS. Cruze referências de diferentes coleções através de hashtags inteligentes.
        </text>
      </g>
    </g>

    <!-- Feature 4: Quicksearch & Keyboard First -->
    <g transform="translate(620, 270)">
      <rect width="580" height="240" rx="12" fill="#F8F8F6" stroke="#4355DB" stroke-width="1.5"/>
      <g transform="translate(36, 36)">
        <rect width="44" height="44" rx="10" fill="#4355DB"/>
        <!-- Command Icon -->
        <text x="22" y="28" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:18px;font-weight:700;fill:#FFFFFF">⌘</text>
        <text x="60" y="24" class="fcard-title">Quick Search &amp; Atalhos Cmd+K</text>
        <text x="60" y="42" class="fcard-badge" fill="#171717">VELOCIDADE LINEAR • TECLADO 100%</text>
        <text y="80" class="fcard-desc">
          Pressione "/" ou "Cmd+K" a qualquer momento para buscar referências em tempo real. Alterne entre projetos e filtre por tipo de mídia sem tirar as mãos do teclado.
        </text>
      </g>
    </g>
  </g>
</g>
</svg>