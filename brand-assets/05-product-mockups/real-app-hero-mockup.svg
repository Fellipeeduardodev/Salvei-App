<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" fill="none">
  <!-- Desktop Browser Window Frame (Clean Modern Chrome) -->
  <defs>
    <filter id="browserDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#browserDropShadow)">
    <rect width="1440" height="960" rx="14" fill="#F8F8F6"/>
    <rect x="0.5" y="0.5" width="1439" height="959" rx="13.5" stroke="#E7E7E5"/>
  </g>

  <!-- Browser Header Bar (macOS Chrome) -->
  <g>
    <rect width="1440" height="52" rx="14" fill="#FFFFFF"/>
    <rect y="40" width="1440" height="12" fill="#FFFFFF"/>
    <line x1="0" y1="52" x2="1440" y2="52" stroke="#E7E7E5"/>
    
    <!-- Window Control Dots -->
    <circle cx="28" cy="26" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/>
    <circle cx="48" cy="26" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/>
    <circle cx="68" cy="26" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/>

    <!-- URL Bar -->
    <rect x="360" y="11" width="720" height="30" rx="6" fill="#F8F8F6" stroke="#E7E7E5"/>
    <g transform="translate(376, 26)">
      <circle cx="5" cy="0" r="4.5" fill="#22c55e"/>
      <text x="18" y="4" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">https://salvei.tech/app</text>
      <text x="560" y="4" style="font-family:'JetBrains Mono';font-size:11px;fill:#737373">[ WORKSPACE ATIVO ]</text>
    </g>
  </g>

  <!-- Salvei App Navigation Bar (Header) -->
  <g transform="translate(0, 52)">
    <rect width="1440" height="56" fill="#FFFFFF"/>
    <line x1="0" y1="56" x2="1440" y2="56" stroke="#E7E7E5"/>

    <!-- Logo on Left -->
    <g transform="translate(36, 14)">
      <rect width="32" height="32" rx="7" fill="#171717"/>
      <circle cx="22" cy="10" r="2" fill="#4355DB"/>
      <path d="M 21 12 C 21 10 19 9 16 9 C 13 9 11 11 11 13 C 11 16 15 17 17 18 C 20 19 22 21 22 23 C 22 26 19 27 15 27 C 12 27 10 25 10 23" 
            stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="23" style="font-family:'Plus Jakarta Sans';font-weight:800;font-size:22px;letter-spacing:-0.04em;fill:#171717">salve<tspan>ı</tspan></text>
      <circle cx="106" cy="9" r="2.6" fill="#4355DB"/>
    </g>

    <!-- Search Input (Middle) -->
    <g transform="translate(360, 12)">
      <rect width="480" height="32" rx="6" fill="#F8F8F6" stroke="#E7E7E5"/>
      <circle cx="20" cy="16" r="5" stroke="#737373" stroke-width="1.4"/>
      <line x1="24" y1="20" x2="28" y2="24" stroke="#737373" stroke-width="1.4"/>
      <text x="36" y="20" style="font-family:'Inter';font-size:12px;fill:#737373">Pesquisar referências, tags ou domínios... (Pressione /)</text>
      <rect x="420" y="7" width="50" height="18" rx="4" fill="#FFFFFF" stroke="#E7E7E5"/>
      <text x="445" y="19" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">Cmd+K</text>
    </g>

    <!-- Right Header Actions (New Reference Button + Avatar) -->
    <g transform="translate(1180, 12)">
      <!-- Add Reference Button -->
      <rect width="150" height="32" rx="6" fill="#4355DB"/>
      <text x="24" y="20" style="font-family:'Inter';font-weight:600;font-size:12px;fill:#FFFFFF">+ Nova Referência</text>
      
      <!-- User Avatar -->
      <g transform="translate(170, 0)">
        <circle cx="16" cy="16" r="16" fill="#171717"/>
        <text x="16" y="20" text-anchor="middle" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:12px;fill:#FFFFFF">FE</text>
      </g>
    </g>
  </g>

  <!-- Filter & Tab Bar Row -->
  <g transform="translate(36, 124)">
    <!-- Views Tabs: Biblioteca / Projetos / Coleções / Tags -->
    <g>
      <rect x="0" y="0" width="104" height="28" rx="5" fill="#171717"/>
      <text x="52" y="18" text-anchor="middle" style="font-family:'Inter';font-weight:600;font-size:12px;fill:#FFFFFF">Biblioteca</text>

      <rect x="114" y="0" width="94" height="28" rx="5" fill="#FFFFFF" stroke="#E7E7E5"/>
      <text x="161" y="18" text-anchor="middle" style="font-family:'Inter';font-size:12px;fill:#171717">Projetos (6)</text>

      <rect x="218" y="0" width="104" height="28" rx="5" fill="#FFFFFF" stroke="#E7E7E5"/>
      <text x="270" y="18" text-anchor="middle" style="font-family:'Inter';font-size:12px;fill:#171717">Coleções (12)</text>

      <rect x="332" y="0" width="90" height="28" rx="5" fill="#FFFFFF" stroke="#E7E7E5"/>
      <text x="377" y="18" text-anchor="middle" style="font-family:'Inter';font-size:12px;fill:#171717">Etiquetas</text>
    </g>

    <!-- Filter chips right -->
    <g transform="translate(1000, 0)">
      <text x="368" y="18" text-anchor="end" style="font-family:'JetBrains Mono';font-size:11px;fill:#737373">TOTAL: 142 REFERÊNCIAS CURADAS</text>
    </g>
  </g>

  <!-- Grid of Real Reference Cards (3 Columns, 2 Rows) -->
  <!-- Row 1: Cards 1, 2, 3 -->
  <!-- Card 1: Linear Interface -->
  <g transform="translate(36, 172)">
    <rect width="440" height="350" rx="8" fill="#FFFFFF" stroke="#E7E7E5"/>
    <rect x="12" y="12" width="416" height="220" rx="6" fill="#191B20"/>
    <image href="../04-image-assets/digital-references/digital-interface-grid-01.jpg" x="12" y="12" width="416" height="220" preserveAspectRatio="xMidYMid slice" rx="6"/>
    
    <!-- Card Info -->
    <g transform="translate(16, 252)">
      <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;fill:#171717">Linear Modern Product Workspace</text>
      <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">linear.app • UI / UX Benchmark</text>
      
      <!-- Tags -->
      <g transform="translate(0, 36)">
        <rect width="70" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="35" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#interface</text>

        <rect x="76" y="0" width="80" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="116" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#dark-mode</text>

        <rect x="162" y="0" width="70" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="197" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#saas-2026</text>
      </g>
    </g>
  </g>

  <!-- Card 2: Editorial Architecture -->
  <g transform="translate(500, 172)">
    <rect width="440" height="350" rx="8" fill="#FFFFFF" stroke="#E7E7E5"/>
    <rect x="12" y="12" width="416" height="220" rx="6" fill="#F8F8F6"/>
    <image href="../04-image-assets/editorial-references/editorial-architecture-01.jpg" x="12" y="12" width="416" height="220" preserveAspectRatio="xMidYMid slice" rx="6"/>
    
    <!-- Card Info -->
    <g transform="translate(16, 252)">
      <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;fill:#171717">Ateliê de Concreto &amp; Luz Rasante</text>
      <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">kinfolk.com • Arquitetura &amp; Forma</text>
      
      <!-- Tags -->
      <g transform="translate(0, 36)">
        <rect width="76" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="38" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#editorial</text>

        <rect x="82" y="0" width="80" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="122" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#fotografia</text>

        <rect x="168" y="0" width="90" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="213" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#composicao</text>
      </g>
    </g>
  </g>

  <!-- Card 3: Hybrid Still Life -->
  <g transform="translate(964, 172)">
    <rect width="440" height="350" rx="8" fill="#FFFFFF" stroke="#E7E7E5"/>
    <rect x="12" y="12" width="416" height="220" rx="6" fill="#F8F8F6"/>
    <image href="../04-image-assets/hybrid-compositions/hybrid-studio-still-01.jpg" x="12" y="12" width="416" height="220" preserveAspectRatio="xMidYMid slice" rx="6"/>
    
    <!-- Card Info -->
    <g transform="translate(16, 252)">
      <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;fill:#171717">Swiss Design Specimen &amp; Grid Tablet</text>
      <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">are.na/fellipe • Tipografia Híbrida</text>
      
      <!-- Tags -->
      <g transform="translate(0, 36)">
        <rect width="80" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="40" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#tipografia</text>

        <rect x="86" y="0" width="70" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="121" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#estudio</text>

        <rect x="162" y="0" width="90" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="207" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#benchmarks</text>
      </g>
    </g>
  </g>

  <!-- Row 2: Cards 4, 5, 6 -->
  <!-- Card 4: Letterpress Close up -->
  <g transform="translate(36, 542)">
    <rect width="440" height="350" rx="8" fill="#FFFFFF" stroke="#E7E7E5"/>
    <rect x="12" y="12" width="416" height="220" rx="6" fill="#F8F8F6"/>
    <image href="../04-image-assets/editorial-references/editorial-typography-print-02.jpg" x="12" y="12" width="416" height="220" preserveAspectRatio="xMidYMid slice" rx="6"/>
    
    <g transform="translate(16, 252)">
      <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;fill:#171717">Letterpress Typography on Cotton</text>
      <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">monotype.com • Tátil &amp; Impresso</text>
      <g transform="translate(0, 36)">
        <rect width="70" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="35" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#impressao</text>
        <rect x="76" y="0" width="80" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="116" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#relevo-seco</text>
      </g>
    </g>
  </g>

  <!-- Card 5: Design System Spec -->
  <g transform="translate(500, 542)">
    <rect width="440" height="350" rx="8" fill="#FFFFFF" stroke="#E7E7E5"/>
    <rect x="12" y="12" width="416" height="220" rx="6" fill="#191B20"/>
    <image href="../04-image-assets/digital-references/digital-design-system-spec-02.jpg" x="12" y="12" width="416" height="220" preserveAspectRatio="xMidYMid slice" rx="6"/>
    
    <g transform="translate(16, 252)">
      <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;fill:#171717">Design System Tokens &amp; Modular Grid</text>
      <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">designsystems.io • Especificação</text>
      <g transform="translate(0, 36)">
        <rect width="90" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="45" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#design-system</text>
        <rect x="96" y="0" width="70" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="131" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#tokens</text>
      </g>
    </g>
  </g>

  <!-- Card 6: Architectural Detail -->
  <g transform="translate(964, 542)">
    <rect width="440" height="350" rx="8" fill="#FFFFFF" stroke="#E7E7E5"/>
    <rect x="12" y="12" width="416" height="220" rx="6" fill="#F8F8F6"/>
    <image href="../04-image-assets/auxiliary-graphics/og-background-texture-1200x630.jpg" x="12" y="12" width="416" height="220" preserveAspectRatio="xMidYMid slice" rx="6"/>
    
    <g transform="translate(16, 252)">
      <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;fill:#171717">Isometric Layered Reference Grid</text>
      <text y="20" style="font-family:'JetBrains Mono';font-size:11px;fill:#4355DB">salvei.tech • Geometria de Marca</text>
      <g transform="translate(0, 36)">
        <rect width="70" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="35" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#geometria</text>
        <rect x="76" y="0" width="80" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <text x="116" y="14" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">#identidade</text>
      </g>
    </g>
  </g>

  <!-- Floating Keyboard Shortcut Badge in Bottom Right -->
  <g transform="translate(1160, 908)">
    <rect width="244" height="32" rx="16" fill="#171717" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <circle cx="16" cy="16" r="3.5" fill="#6375F1"/>
    <text x="30" y="20" style="font-family:'JetBrains Mono';font-size:10px;font-weight:600;fill:#FFFFFF">PRESSIONE [ ? ] PARA ATALHOS</text>
  </g>
</svg>