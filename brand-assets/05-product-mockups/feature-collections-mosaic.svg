<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" rx="12" fill="#F8F8F6"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="11.5" stroke="#E7E7E5"/>
  
  <g transform="translate(40, 40)">
    <text style="font-family:'JetBrains Mono';font-size:10px;font-weight:600;fill:#4355DB;letter-spacing:0.14em;text-transform:uppercase">FEATURE SHOWCASE • CURADORIAS TEMÁTICAS</text>
    <text y="30" style="font-family:'Plus Jakarta Sans';font-weight:800;font-size:24px;fill:#171717">Mosaicos Visuais de Coleção</text>
    <text y="54" style="font-family:'Inter';font-size:13px;fill:#737373">Pré-visualizações dinâmicas em proporção editorial 16:9 das referências curadas.</text>
  </g>

  <!-- 2 Collection Cards Grid -->
  <!-- Collection Card 1 -->
  <g transform="translate(40, 120)">
    <rect width="345" height="320" rx="8" fill="#FFFFFF" stroke="#E7E7E5"/>
    <!-- 16:9 Mosaic Preview Header -->
    <g transform="translate(0, 0)">
      <rect width="345" height="194" rx="8" fill="#171717"/>
      <!-- 3 Columns inside preview -->
      <image href="../04-image-assets/digital-references/digital-interface-grid-01.jpg" x="0" y="0" width="115" height="194" preserveAspectRatio="xMidYMid slice"/>
      <image href="../04-image-assets/editorial-references/editorial-architecture-01.jpg" x="115" y="0" width="115" height="194" preserveAspectRatio="xMidYMid slice"/>
      <image href="../04-image-assets/hybrid-compositions/hybrid-studio-still-01.jpg" x="230" y="0" width="115" height="194" preserveAspectRatio="xMidYMid slice"/>
      <line x1="115" y1="0" x2="115" y2="194" stroke="#FFFFFF" stroke-opacity="0.3"/>
      <line x1="230" y1="0" x2="230" y2="194" stroke="#FFFFFF" stroke-opacity="0.3"/>
    </g>
    <!-- Collection Info -->
    <g transform="translate(18, 222)">
      <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:16px;fill:#171717">Editorial &amp; Grids Suíços</text>
      <text y="20" style="font-family:'Inter';font-size:12px;fill:#737373">Acervo de referências com tipografia assimétrica e grids modulares.</text>
      <line x1="0" y1="46" x2="310" y2="46" stroke="#E7E7E5"/>
      <text y="68" style="font-family:'JetBrains Mono';font-size:11px;font-weight:600;fill:#171717">[ 28 REFERÊNCIAS ]</text>
      <text x="310" y="68" text-anchor="end" style="font-family:'JetBrains Mono';font-size:11px;font-weight:600;fill:#4355DB">VER ACERVO →</text>
    </g>
  </g>

  <!-- Collection Card 2 -->
  <g transform="translate(415, 120)">
    <rect width="345" height="320" rx="8" fill="#FFFFFF" stroke="#E7E7E5"/>
    <g transform="translate(0, 0)">
      <rect width="345" height="194" rx="8" fill="#171717"/>
      <image href="../04-image-assets/digital-references/digital-design-system-spec-02.jpg" x="0" y="0" width="115" height="194" preserveAspectRatio="xMidYMid slice"/>
      <image href="../04-image-assets/editorial-references/editorial-typography-print-02.jpg" x="115" y="0" width="115" height="194" preserveAspectRatio="xMidYMid slice"/>
      <image href="../04-image-assets/auxiliary-graphics/og-background-texture-1200x630.jpg" x="230" y="0" width="115" height="194" preserveAspectRatio="xMidYMid slice"/>
      <line x1="115" y1="0" x2="115" y2="194" stroke="#FFFFFF" stroke-opacity="0.3"/>
      <line x1="230" y1="0" x2="230" y2="194" stroke="#FFFFFF" stroke-opacity="0.3"/>
    </g>
    <g transform="translate(18, 222)">
      <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:16px;fill:#171717">Design Systems &amp; Tokens 2026</text>
      <text y="20" style="font-family:'Inter';font-size:12px;fill:#737373">Componentes reutilizáveis, escalas e paletas de contraste calibrado.</text>
      <line x1="0" y1="46" x2="310" y2="46" stroke="#E7E7E5"/>
      <text y="68" style="font-family:'JetBrains Mono';font-size:11px;font-weight:600;fill:#171717">[ 42 REFERÊNCIAS ]</text>
      <text x="310" y="68" text-anchor="end" style="font-family:'JetBrains Mono';font-size:11px;font-weight:600;fill:#4355DB">VER ACERVO →</text>
    </g>
  </g>
</svg>