      <text y="28" style="font-family:'Inter';font-size:12px;fill:#737373">Ao clicar em qualquer tag, a visualização atualiza instantaneamente sem recarregar a tela.</text>
      <g transform="translate(0, 48)">
        <rect width="160" height="36" rx="6" fill="#FFFFFF" stroke="#E7E7E5"/>
        <text x="80" y="22" text-anchor="middle" style="font-family:'Inter';font-weight:600;font-size:12px;fill:#171717">Linear Workspace</text>

        <rect x="176" y="0" width="160" height="36" rx="6" fill="#FFFFFF" stroke="#E7E7E5"/>
        <text x="256" y="22" text-anchor="middle" style="font-family:'Inter';font-weight:600;font-size:12px;fill:#171717">Stripe Dashboard</text>

        <rect x="352" y="0" width="160" height="36" rx="6" fill="#FFFFFF" stroke="#E7E7E5"/>
        <text x="432" y="22" text-anchor="middle" style="font-family:'Inter';font-weight:600;font-size:12px;fill:#171717">Raycast Store</text>
      </g>
    </g>
