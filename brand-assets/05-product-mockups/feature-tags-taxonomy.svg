<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" rx="12" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="11.5" stroke="#E7E7E5"/>

  <g transform="translate(40, 40)">
    <text style="font-family:'JetBrains Mono';font-size:10px;font-weight:600;fill:#4355DB;letter-spacing:0.14em;text-transform:uppercase">TAXONOMIA TRANSVERSAL</text>
    <text y="30" style="font-family:'Plus Jakarta Sans';font-weight:800;font-size:24px;fill:#171717">Diretório e Nuvem de Etiquetas</text>
    <text y="54" style="font-family:'Inter';font-size:13px;fill:#737373">Organização horizontal livre. Renomeie ou filtre referências sem recriação de pastas.</text>
  </g>

  <!-- Search & Stats Bar -->
  <g transform="translate(40, 120)">
    <rect width="720" height="48" rx="6" fill="#F8F8F6" stroke="#E7E7E5"/>
    <text x="20" y="28" style="font-family:'JetBrains Mono';font-size:11px;font-weight:600;fill:#171717">TOTAL: 24 ETIQUETAS ATIVAS</text>
    <rect x="490" y="10" width="210" height="28" rx="4" fill="#FFFFFF" stroke="#E7E7E5"/>
    <text x="506" y="28" style="font-family:'Inter';font-size:11px;fill:#737373">Filtrar etiquetas...</text>
  </g>

  <!-- Tag Chips Cloud -->
  <g transform="translate(40, 190)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="32" rx="16" fill="#4355DB"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-weight:600;font-size:12px;fill:#FFFFFF">#interface (48)</text>
    </g>
    <g transform="translate(140, 0)">
      <rect width="136" height="32" rx="16" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">#dark-mode (34)</text>
    </g>
    <g transform="translate(286, 0)">
      <rect width="130" height="32" rx="16" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">#editorial (28)</text>
    </g>
    <g transform="translate(426, 0)">
      <rect width="140" height="32" rx="16" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">#tipografia (24)</text>
    </g>
    <g transform="translate(576, 0)">
      <rect width="130" height="32" rx="16" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">#fotografia (19)</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 48)">
      <rect width="156" height="32" rx="16" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">#design-system (17)</text>
    </g>
    <g transform="translate(166, 48)">
      <rect width="120" height="32" rx="16" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">#tokens (15)</text>
    </g>
    <g transform="translate(296, 48)">
      <rect width="136" height="32" rx="16" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">#saas-2026 (14)</text>
    </g>
    <g transform="translate(442, 48)">
      <rect width="130" height="32" rx="16" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">#relevo (11)</text>
    </g>
    <g transform="translate(582, 48)">
      <rect width="124" height="32" rx="16" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="20" style="font-family:'JetBrains Mono';font-size:12px;fill:#171717">#grid-suico (9)</text>
    </g>
