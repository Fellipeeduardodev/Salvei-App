<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Backdrop -->
  <rect width="800" height="500" rx="12" fill="#171717" fill-opacity="0.6"/>
  
  <!-- Centered Modal Card -->
  <g transform="translate(100, 60)">
    <rect width="600" height="380" rx="10" fill="#FFFFFF" stroke="#E7E7E5" stroke-width="1.5"/>
    
    <!-- Input Bar -->
    <g transform="translate(24, 24)">
      <circle cx="16" cy="16" r="6" stroke="#4355DB" stroke-width="2"/>
      <line x1="21" y1="21" x2="26" y2="26" stroke="#4355DB" stroke-width="2"/>
      <text x="36" y="21" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:16px;fill:#171717">dark-mode| </text>
      <rect x="490" y="6" width="50" height="20" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="515" y="19" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">ESC</text>
    </g>
    <line x1="0" y1="64" x2="600" y2="64" stroke="#E7E7E5"/>

    <!-- Search Results List -->
    <g transform="translate(24, 80)">
      <text style="font-family:'JetBrains Mono';font-size:10px;fill:#737373;letter-spacing:0.12em;text-transform:uppercase">RESULTADOS SUGERIDOS (4)</text>

      <!-- Item 1 (Focused) -->
      <g transform="translate(0, 16)">
        <rect width="552" height="54" rx="6" fill="#4355DB" fill-opacity="0.08" stroke="#4355DB" stroke-opacity="0.3"/>
        <rect x="12" y="10" width="46" height="34" rx="4" fill="#191B20"/>
        <text x="70" y="26" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:13px;fill:#171717">Linear Modern Product Workspace</text>
        <text x="70" y="42" style="font-family:'JetBrains Mono';font-size:10px;fill:#4355DB">linear.app • #dark-mode #saas</text>
        <rect x="470" y="17" width="70" height="20" rx="4" fill="#4355DB"/>
        <text x="505" y="30" text-anchor="middle" style="font-family:'Inter';font-weight:600;font-size:10px;fill:#FFFFFF">Enter ↵</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 78)">
        <rect width="552" height="54" rx="6" fill="#FFFFFF" stroke="#E7E7E5"/>
        <rect x="12" y="10" width="46" height="34" rx="4" fill="#191B20"/>
        <text x="70" y="26" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:13px;fill:#171717">Raycast Extensions Store Dark</text>
        <text x="70" y="42" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">raycast.com • #dark-mode #desktop</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 140)">
        <rect width="552" height="54" rx="6" fill="#FFFFFF" stroke="#E7E7E5"/>
        <rect x="12" y="10" width="46" height="34" rx="4" fill="#171717"/>
        <text x="70" y="26" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:13px;fill:#171717">Vercel Dashboard Tokens Dark Mode</text>
        <text x="70" y="42" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">vercel.com • #design-system #tokens</text>
      </g>
    </g>

    <!-- Footer Bar -->
    <g transform="translate(24, 340)">
      <line x1="0" y1="0" x2="552" y2="0" stroke="#E7E7E5"/>
      <text y="22" style="font-family:'JetBrains Mono';font-size:10px;fill:#737373">[ ↑ / ↓ ] NAVEGAR • [ ENTER ] ABRIR REFERÊNCIA • [ ESC ] FECHAR</text>
    </g>
  </g>
</svg>