<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Dark Sophisticated Brand Canvas -->
  <rect width="1200" height="630" fill="#171717"/>
  
  <!-- Subtle Background Texture -->
  <g opacity="0.45">
    <image href="../04-image-assets/auxiliary-graphics/og-background-texture-1200x630.jpg" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Luminous Subtle Radial Backdrop -->
  <radialGradient id="ogGlow" cx="20%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#4355DB" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="#171717" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Border Perimeter 1px -->
  <rect x="24" y="24" width="1152" height="582" rx="14" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .og-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #6375F1; letter-spacing: 0.18em; text-transform: uppercase; }
    .og-hero-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 54px; fill: #FFFFFF; letter-spacing: -0.04em; line-height: 1.08; }
    .og-subtitle { font-family: 'Inter', sans-serif; font-size: 20px; fill: #A8A8A6; line-height: 1.5; }
    .og-url { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; fill: #FFFFFF; letter-spacing: 0.12em; }
  </style>

  <!-- Content Group -->
  <g transform="translate(80, 80)">
    <!-- Top Wordmark & Tag -->
    <g transform="translate(0, 20)">
      <!-- Symbol + Wordmark -->
      <g transform="translate(0, 0)">
        <rect width="48" height="48" rx="12" fill="#FFFFFF" fill-opacity="0.1"/>
        <circle cx="34" cy="14" r="3.5" fill="#6375F1"/>
        <path d="M 32 18 C 32 14 28 12 24 12 C 18 12 15 15 15 18 C 15 23 21 24 25 26 C 29 28 32 30 32 35 C 32 39 28 42 22 42 C 17 42 14 39 14 36" 
              stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="64" y="34" style="font-family:'Plus Jakarta Sans';font-weight:800;font-size:36px;letter-spacing:-0.04em;fill:#FFFFFF">salve<tspan>ı</tspan></text>
      <circle cx="166" cy="12" r="3.8" fill="#6375F1"/>
      <text x="210" y="30" class="og-badge">VISUAL WORKSPACE</text>
    </g>

    <!-- Main Headline -->
    <g transform="translate(0, 160)">
      <text class="og-hero-title">Salve, organize</text>
      <text y="64" class="og-hero-title">&amp; encontre suas</text>
      <text y="128" class="og-hero-title"><tspan fill="#6375F1">referências.</tspan></text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 360)">
      <text class="og-subtitle">A biblioteca visual de alta precisão para designers e desenvolvedores.</text>
      <text y="28" class="og-subtitle">Guarde websites, capturas e códigos em um ateliê digital privado.</text>
    </g>

    <!-- Bottom URL & Pill -->
    <g transform="translate(0, 460)">
      <rect width="240" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <circle cx="22" cy="21" r="5" fill="#22c55e"/>
      <text x="38" y="26" class="og-url">https://salvei.tech</text>
    </g>
  </g>

  <!-- Right Floating Mockup Preview Hint -->
  <g transform="translate(740, 140)">
    <rect width="380" height="380" rx="16" fill="#191B20" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
    <!-- Mockup Preview content inside -->
    <rect x="0" y="0" width="380" height="34" rx="16" fill="#15171C"/>
    <circle cx="20" cy="17" r="4" fill="#EF4444" opacity="0.8"/>
    <circle cx="34" cy="17" r="4" fill="#F59E0B" opacity="0.8"/>
    <circle cx="48" cy="17" r="4" fill="#22c55e" opacity="0.8"/>
    <rect x="80" y="9" width="220" height="16" rx="4" fill="#20232A"/>
    
    <!-- Mini Reference Cards inside -->
    <g transform="translate(20, 54)">
      <rect width="160" height="140" rx="6" fill="#20232A" stroke="#2D3139"/>
      <rect x="10" y="10" width="140" height="80" rx="4" fill="#4355DB" fill-opacity="0.2"/>
      <text x="12" y="110" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:11px;fill:#FFFFFF">Stripe Redesign</text>
      <text x="12" y="126" style="font-family:'JetBrains Mono';font-size:9px;fill:#9CA3AF">stripe.com</text>
    </g>

    <g transform="translate(200, 54)">
      <rect width="160" height="140" rx="6" fill="#20232A" stroke="#2D3139"/>
      <rect x="10" y="10" width="140" height="80" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
      <text x="12" y="110" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:11px;fill:#FFFFFF">Linear Brand Guide</text>
      <text x="12" y="126" style="font-family:'JetBrains Mono';font-size:9px;fill:#9CA3AF">linear.app</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="340" height="100" rx="6" fill="#20232A" stroke="#2D3139"/>
      <rect x="12" y="12" width="76" height="76" rx="4" fill="#4355DB" fill-opacity="0.3"/>
      <text x="100" y="36" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:12px;fill:#FFFFFF">Kinfolk Architecture 01</text>
      <text x="100" y="54" style="font-family:'JetBrains Mono';font-size:10px;fill:#9CA3AF">#editorial #fotografia #grid</text>
      <rect x="100" y="68" width="120" height="18" rx="4" fill="#4355DB" fill-opacity="0.2"/>
      <text x="110" y="81" style="font-family:'JetBrains Mono';font-size:9px;fill:#6375F1">[ 24 REFERÊNCIAS ]</text>
    </g>

    <rect x="0" y="346" width="380" height="34" rx="16" fill="#15171C"/>
    <text x="190" y="368" text-anchor="middle" style="font-family:'JetBrains Mono';font-size:10px;fill:#A8A8A6">SALVEI WORKSPACE INTERFACE</text>
  </g>
</svg>