<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <rect width="1920" height="1080" fill="#F8F8F6"/>
  <rect x="0.5" y="0.5" width="1919" height="1079" stroke="#E7E7E5"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .mb-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #4355DB; letter-spacing: 0.16em; text-transform: uppercase; }
    .mb-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 38px; fill: #171717; letter-spacing: -0.03em; }
    .mb-desc { font-family: 'Inter', sans-serif; font-size: 15px; fill: #737373; }
    .card-hdr { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 20px; fill: #171717; }
    .card-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #4355DB; letter-spacing: 0.14em; text-transform: uppercase; }
    .card-text { font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.6; fill: #737373; }
  </style>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <text class="mb-tag">03 / CURATED MOODBOARDS &amp; VISUAL BENCHMARKS</text>
    <text y="42" class="mb-title">Moodboards: Digital, Editorial &amp; A Identidade Salvei</text>
    <text y="74" class="mb-desc">Três territórios conceituais de referência que estabelecem o universo cromático, tátil e tipográfico da marca.</text>
  </g>

  <!-- 3 Moodboard Panels Grid (Width: 560 each, Height: 780) -->
  <!-- Panel A: Digital -->
  <g transform="translate(80, 190)">
    <rect width="560" height="800" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
    <g transform="translate(32, 32)">
      <text class="card-meta">MOODBOARD A • TERRITÓRIO DIGITAL</text>
      <text y="30" class="card-hdr">Precisão de Produto &amp; Interfaces</text>
      <text y="60" class="card-text">Interfaces contemporâneas, tipografia suíça web, densidade funcional e micro-contrastes.</text>
      
      <!-- Visual container for image -->
      <g transform="translate(0, 90)">
        <rect width="496" height="320" rx="8" fill="#171717"/>
        <image href="../04-image-assets/digital-references/digital-interface-grid-01.jpg" width="496" height="320" preserveAspectRatio="xMidYMid slice" rx="8"/>
        <rect x="0.5" y="0.5" width="495" height="319" rx="7.5" stroke="#E7E7E5" stroke-opacity="0.3"/>
      </g>

      <!-- Key References Specs -->
      <g transform="translate(0, 440)">
        <rect width="496" height="170" rx="8" fill="#F8F8F6" stroke="#E7E7E5"/>
        <g transform="translate(24, 24)">
          <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">Referências de Excelência Digital:</text>
          <text y="26" style="font-family:'Inter';font-size:12px;fill:#737373">• Linear: Disciplina geométrica, atalhos Cmd+K e densidade de informação.</text>
          <text y="48" style="font-family:'Inter';font-size:12px;fill:#737373">• Raycast: Contenção, neutralidade de superfícies e foco na tarefa.</text>
          <text y="70" style="font-family:'Inter';font-size:12px;fill:#737373">• Are.na: Primazia do objeto curado sobre a moldura do software.</text>
          <text y="92" style="font-family:'Inter';font-size:12px;fill:#737373">• Vercel: Tipografia geométrica pura e paleta de alto contraste monocromático.</text>
        </g>
      </g>

      <g transform="translate(0, 630)">
        <text style="font-family:'JetBrains Mono';font-size:10px;fill:#737373;letter-spacing:0.12em;text-transform:uppercase">PALETA DO TERRITÓRIO DIGITAL:</text>
        <rect x="0" y="15" width="40" height="24" rx="4" fill="#171717"/>
        <rect x="48" y="15" width="40" height="24" rx="4" fill="#4355DB"/>
        <rect x="96" y="15" width="40" height="24" rx="4" fill="#191B20"/>
        <rect x="144" y="15" width="40" height="24" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
      </g>
    </g>
  </g>

  <!-- Panel B: Editorial -->
  <g transform="translate(680, 190)">
    <rect width="560" height="800" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
    <g transform="translate(32, 32)">
      <text class="card-meta">MOODBOARD B • TERRITÓRIO EDITORIAL</text>
      <text y="30" class="card-hdr">Materialidade, Livros &amp; Arquitetura</text>
      <text y="60" class="card-text">Fotografia arquitetônica, papel encorpado, relevo seco e tensão tipográfica de ateliê.</text>
      
      <!-- Visual container for image -->
      <g transform="translate(0, 90)">
        <rect width="496" height="320" rx="8" fill="#F8F8F6"/>
        <image href="../04-image-assets/editorial-references/editorial-architecture-01.jpg" width="496" height="320" preserveAspectRatio="xMidYMid slice" rx="8"/>
        <rect x="0.5" y="0.5" width="495" height="319" rx="7.5" stroke="#E7E7E5" stroke-opacity="0.3"/>
      </g>

      <!-- Key References Specs -->
      <g transform="translate(0, 440)">
        <rect width="496" height="170" rx="8" fill="#F8F8F6" stroke="#E7E7E5"/>
        <g transform="translate(24, 24)">
          <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">Referências de Excelência Editorial:</text>
          <text y="26" style="font-family:'Inter';font-size:12px;fill:#737373">• Kinfolk / Cereal: Espaços negativos generosos e ritmo contemplativo.</text>
          <text y="48" style="font-family:'Inter';font-size:12px;fill:#737373">• Tipografia Suíça (Müller-Brockmann): Rigor de grid modular e hierarquia.</text>
          <text y="70" style="font-family:'Inter';font-size:12px;fill:#737373">• Arquitetura Brutalista &amp; Minimalista: Concreto aparente e pedra natural.</text>
          <text y="92" style="font-family:'Inter';font-size:12px;fill:#737373">• Publicações de Arte: Capas em relevo seco e encadernação canelada.</text>
        </g>
      </g>

      <g transform="translate(0, 630)">
        <text style="font-family:'JetBrains Mono';font-size:10px;fill:#737373;letter-spacing:0.12em;text-transform:uppercase">PALETA DO TERRITÓRIO EDITORIAL:</text>
        <rect x="0" y="15" width="40" height="24" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <rect x="48" y="15" width="40" height="24" rx="4" fill="#E8E8E4"/>
        <rect x="96" y="15" width="40" height="24" rx="4" fill="#171717"/>
        <rect x="144" y="15" width="40" height="24" rx="4" fill="#D4D4D0"/>
      </g>
    </g>
  </g>

  <!-- Panel C: Hybrid Salvei -->
  <g transform="translate(1280, 190)">
    <rect width="560" height="800" rx="12" fill="#FFFFFF" stroke="#4355DB" stroke-width="2"/>
    <g transform="translate(32, 32)">
      <text class="card-meta">MOODBOARD C • A IDENTIDADE SALVEI</text>
      <text y="30" class="card-hdr">A Síntese do Ateliê Digital</text>
      <text y="60" class="card-text">A fusão de rigor técnico e sensibilidade tátil: o Salvei como casa do repertório criativo.</text>
      
      <!-- Visual container for image -->
      <g transform="translate(0, 90)">
        <rect width="496" height="320" rx="8" fill="#F8F8F6"/>
        <image href="../04-image-assets/hybrid-compositions/hybrid-studio-still-01.jpg" width="496" height="320" preserveAspectRatio="xMidYMid slice" rx="8"/>
        <rect x="0.5" y="0.5" width="495" height="319" rx="7.5" stroke="#E7E7E5" stroke-opacity="0.3"/>
      </g>

      <!-- Key References Specs -->
      <g transform="translate(0, 440)">
        <rect width="496" height="170" rx="8" fill="#F8F8F6" stroke="#E7E7E5"/>
        <g transform="translate(24, 24)">
          <text style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:14px;fill:#171717">O Manifesto Estético Salvei:</text>
          <text y="26" style="font-family:'Inter';font-size:12px;fill:#737373">• O screenshot é o protagonista: a interface não compete com a inspiração.</text>
          <text y="48" style="font-family:'Inter';font-size:12px;fill:#737373">• Tipografia com autoridade: títulos compactos e micro-legendas técnicas.</text>
          <text y="70" style="font-family:'Inter';font-size:12px;fill:#737373">• Acento Cobalto (#4355DB): precisão de software com nobreza de tinta pura.</text>
          <text y="92" style="font-family:'Inter';font-size:12px;fill:#737373">• Neutralidade arquitetônica: o espaço parece esculpido em ateliê.</text>
        </g>
      </g>

      <g transform="translate(0, 630)">
        <text style="font-family:'JetBrains Mono';font-size:10px;fill:#4355DB;letter-spacing:0.12em;text-transform:uppercase">PALETA COMPLETA SALVEI:</text>
        <rect x="0" y="15" width="40" height="24" rx="4" fill="#F8F8F6" stroke="#E7E7E5"/>
        <rect x="48" y="15" width="40" height="24" rx="4" fill="#171717"/>
        <rect x="96" y="15" width="40" height="24" rx="4" fill="#4355DB"/>
        <rect x="144" y="15" width="40" height="24" rx="4" fill="#E8E8E4"/>
      </g>
    </g>
  </g>
</svg>