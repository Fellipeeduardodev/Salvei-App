<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <rect width="1200" height="600" rx="16" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="15.5" stroke="#E7E7E5"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 26px; fill: #171717; letter-spacing: -0.02em; }
    .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #737373; letter-spacing: 0.14em; text-transform: uppercase; }
    .swatch-name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 15px; fill: #171717; }
    .swatch-hex { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #171717; }
    .swatch-role { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #737373; }
  </style>

  <g transform="translate(60, 50)">
    <text class="title">Paleta de Cores &amp; Sistema Cromático</text>
    <text y="24" class="subtitle">SALVEI VISUAL IDENTITY TOKENS / PALETTE SPECIFICATION</text>
  </g>

  <!-- 4 Main Palette Cards -->
  <!-- 1. Off-White -->
  <g transform="translate(60, 120)">
    <rect width="240" height="260" rx="12" fill="#F8F8F6" stroke="#E7E7E5" stroke-width="1.5"/>
    <rect y="260" width="240" height="130" fill="#FFFFFF"/>
    <text x="16" y="295" class="swatch-name">Off-White Ateliê</text>
    <text x="16" y="320" class="swatch-hex">#F8F8F6</text>
    <text x="16" y="345" class="swatch-role">Fundo Principal (Light Mode)</text>
    <text x="16" y="365" class="swatch-role">RGB: 248, 248, 246</text>
  </g>

  <!-- 2. Grafite Profundo -->
  <g transform="translate(330, 120)">
    <rect width="240" height="260" rx="12" fill="#171717"/>
    <text x="16" y="295" class="swatch-name">Grafite Arquitetônico</text>
    <text x="16" y="320" class="swatch-hex">#171717</text>
    <text x="16" y="345" class="swatch-role">Tipografia, Ícones e Dark Shell</text>
    <text x="16" y="365" class="swatch-role">RGB: 23, 23, 23</text>
  </g>

  <!-- 3. Azul Cobalto -->
  <g transform="translate(600, 120)">
    <rect width="240" height="260" rx="12" fill="#4355DB"/>
    <circle cx="205" cy="35" r="14" fill="#FFFFFF" fill-opacity="0.25"/>
    <text x="16" y="295" class="swatch-name">Azul Cobalto Curadoria</text>
    <text x="16" y="320" class="swatch-hex">#4355DB</text>
    <text x="16" y="345" class="swatch-role">Ações, Links, Pin de Marca</text>
    <text x="16" y="365" class="swatch-role">RGB: 67, 85, 219</text>
  </g>

  <!-- 4. Cinza Editorial -->
  <g transform="translate(870, 120)">
    <rect width="240" height="260" rx="12" fill="#E8E8E4" stroke="#E7E7E5"/>
    <text x="16" y="295" class="swatch-name">Cinza Editorial</text>
    <text x="16" y="320" class="swatch-hex">#E8E8E4</text>
    <text x="16" y="345" class="swatch-role">Bordas, Divisórias &amp; Apoio</text>
    <text x="16" y="365" class="swatch-role">RGB: 232, 232, 228</text>
  </g>

  <!-- Micro Footer Spec -->
  <g transform="translate(60, 545)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#E7E7E5"/>
    <text y="25" class="swatch-role">DIRETRIZ DE CONTRASTE WCAG AAA: O texto Grafite sobre Off-white possui ratio de 15.8:1. O Cobalto sobre Branco possui ratio de 6.2:1 (AA+).</text>
  </g>
</svg>