<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Salvei V3: Minimal Precision Pill Cut -->
  <defs>
    <linearGradient id="v3-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D40F5"/>
      <stop offset="100%" stop-color="#2D30D0"/>
    </linearGradient>
  </defs>
  <g transform="translate(18, 16)">
    <!-- Top Pill Segment -->
    <path d="M 20 4 C 11.2 4 4 11.2 4 20 C 4 28.8 11.2 36 20 36 L 64 26 C 72.8 26 80 18.8 80 10 C 80 5.6 78.2 1.6 75.3 -1.3 L 20 4 Z" 
          clip-path="url(#v3-top-clip)" fill="url(#v3-blue)" transform="rotate(-15 42 20)"/>
    <!-- Clean Rounded S-Pills -->
    <rect x="6" y="8" width="68" height="26" rx="13" transform="rotate(-16 40 21)" fill="url(#v3-blue)"/>
    <rect x="12" y="52" width="68" height="26" rx="13" transform="rotate(-16 46 65)" fill="url(#v3-blue)"/>
    <!-- Notches -->
    <circle cx="78" cy="30" r="7" fill="#F7F6F2"/>
    <circle cx="8" cy="62" r="7" fill="#F7F6F2"/>
  </g>
