<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="#F8F8F6"/>
  <rect x="0.5" y="0.5" width="1919" height="1079" stroke="#E7E7E5"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .board-page-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #4355DB; letter-spacing: 0.16em; text-transform: uppercase; }
    .board-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 38px; fill: #171717; letter-spacing: -0.03em; }
    .board-desc { font-family: 'Inter', sans-serif; font-size: 15px; fill: #737373; line-height: 1.5; }
    .card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 18px; fill: #171717; letter-spacing: -0.01em; }
    .card-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #737373; letter-spacing: 0.14em; text-transform: uppercase; }
    .card-body { font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.6; fill: #171717; }
    .highlight-pill { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #4355DB; }
    .hero-quote { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 32px; fill: #171717; letter-spacing: -0.03em; line-height: 1.2; }
    .hero-subquote { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 16px; fill: #4355DB; letter-spacing: -0.01em; }
  </style>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <text class="board-page-tag">01 / BRAND STRATEGY &amp; POSITIONING ARCHITECTURE</text>
    <text y="42" class="board-title">Salvei — Estratégia de Marca &amp; Posicionamento</text>
    <text y="74" class="board-desc">Plataforma de curadoria visual pessoal. "Capture agora. Organize depois. Encontre quando precisar."</text>
  </g>

  <!-- Big Hero Message Banner -->
  <g transform="translate(80, 190)">
    <rect width="1760" height="150" rx="14" fill="#FFFFFF" stroke="#E7E7E5" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="150" rx="4" fill="#4355DB"/>
    <g transform="translate(48, 52)">
      <text class="card-label">MENSAGEM CENTRAL &amp; CREATIVE NORTH STAR</text>
      <text y="38" class="hero-quote">"Salve, organize e encontre suas referências."</text>
      <text y="68" class="hero-subquote">Conceito Criativo: Uma biblioteca visual para suas próximas ideias.</text>
    </g>
    <!-- Stamp -->
    <g transform="translate(1500, 38)">
      <rect width="210" height="74" rx="8" fill="#F8F8F6" stroke="#E7E7E5"/>
      <text x="20" y="32" class="card-label">PRODUTO OFICIAL</text>
      <text x="20" y="52" style="font-family:'Plus Jakarta Sans';font-weight:800;font-size:16px;fill:#171717">100% Gratuito</text>
    </g>
  </g>

  <!-- Grid of 6 Core Pillars -->
  <!-- Card 1: Audiência -->
  <g transform="translate(80, 370)">
    <rect width="560" height="200" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
    <g transform="translate(32, 38)">
      <text class="card-label">01 • PÚBLICO-ALVO EQUILIBRADO</text>
      <text y="28" class="card-title">Designers &amp; Desenvolvedores</text>
      <text y="62" class="card-body">Tratados com rigor simétrico de importância. Para designers: curadoria visual pura,</text>
      <text y="82" class="card-body">paletas, moodboards e proporções de interface. Para desenvolvedores: trechos de</text>
      <text y="102" class="card-body">código CSS/Tailwind, atalhos de teclado ágeis, metadados técnicos e densidade.</text>
    </g>
  </g>

  <!-- Card 2: Sensação & Personalidade -->
  <g transform="translate(680, 370)">
    <rect width="560" height="200" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
    <g transform="translate(32, 38)">
      <text class="card-label">02 • SENSAÇÃO &amp; TOM DE VOZ</text>
      <text y="28" class="card-title">Inspiração, Rigor &amp; Serenidade</text>
      <text y="62" class="card-body">Personalidade: Sofisticada, discreta, editorial, contemporânea, minimalista e</text>
      <text y="82" class="card-body">profundamente funcional. Recusa barulho gráfico, gradientes de marketing saturados</text>
      <text y="102" class="card-body">e popups invasivos. A interface atua como galeria em silêncio editorial.</text>
    </g>
  </g>

  <!-- Card 3: Posicionamento -->
  <g transform="translate(1280, 370)">
    <rect width="560" height="200" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
    <g transform="translate(32, 38)">
      <text class="card-label">03 • PROPOSTA DE VALOR</text>
      <text y="28" class="card-title">Mais que Bookmarks, um Ateliê</text>
      <text y="62" class="card-body">Favoritos convencionais morrem esquecidos no browser. O Salvei transforma a captura</text>
      <text y="82" class="card-body">da web em objeto de design com previews táteis, taxonomias transversais por tags,</text>
      <text y="102" class="card-body">projetos dedicados por entrega e mosaicos de curadoria visual contínua.</text>
    </g>
  </g>

  <!-- Row 2: 3 Operational Principles -->
  <!-- Card 4: Direção de Arte Híbrida -->
  <g transform="translate(80, 600)">
    <rect width="560" height="230" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
    <g transform="translate(32, 38)">
      <text class="card-label">04 • DIRETRIZ VISUAL HÍBRIDA</text>
      <text y="28" class="card-title">Digital Real + Editorial Suíço</text>
      <text y="62" class="card-body">Equilíbrio obrigatório entre duas potências estéticas:</text>
      <text y="86" class="card-body">• Digital: Capturas reais do produto, websites, design systems e interfaces.</text>
      <text y="108" class="card-body">• Editorial: Fotografia de arquitetura, arte, relevo seco e tipografia espacial.</text>
      <text y="130" class="card-body">Zero 3D plástico, zero vetores genéricos, zero ilustrações corporativas vazias.</text>
    </g>
  </g>

  <!-- Card 5: Pilares de Navegação -->
  <g transform="translate(680, 600)">
    <rect width="560" height="230" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
    <g transform="translate(32, 38)">
      <text class="card-label">05 • FLUXO ESSENCIAL EM 3 TEMPOS</text>
      <text y="28" class="card-title">1. Salvar • 2. Organizar • 3. Encontrar</text>
      <text y="62" class="card-body">1. Salve em segundos: cole com Ctrl+V, arraste imagens ou insira URLs rápidas.</text>
      <text y="86" class="card-body">2. Organize no seu ritmo: crie coleções estéticas, vincule a projetos ou use tags livres.</text>
      <text y="108" class="card-body">3. Encontre instantaneamente: busca facetada com comando [ Cmd + K ], filtros de mídia</text>
      <text y="130" class="card-body">e pesquisa sem recarregamentos intrusivos.</text>
    </g>
  </g>

  <!-- Card 6: Sustentabilidade do Produto -->
  <g transform="translate(1280, 600)">
    <rect width="560" height="230" rx="12" fill="#FFFFFF" stroke="#E7E7E5"/>
    <g transform="translate(32, 38)">
      <text class="card-label">06 • TRANSPARÊNCIA &amp; ACESSO</text>
      <text y="28" class="card-title">Infraestrutura Real &amp; Nuvem</text>
      <text y="62" class="card-body">Banco de dados relacional PostgreSQL via Supabase com autenticação segura RLS,</text>
      <text y="86" class="card-body">armazenamento de mídia privado e persistência multi-dispositivo.</text>
      <text y="108" class="card-body">Sem planos pagos simulados, sem paywalls e sem fricção artificial.</text>
      <text y="130" class="card-body">Acessível em: <tspan fill="#4355DB" font-weight="600">https://salvei.tech</tspan></text>
    </g>
  </g>

  <!-- Bottom Metadata Bar -->
  <g transform="translate(80, 870)">
    <rect width="1760" height="130" rx="12" fill="#171717"/>
    <g transform="translate(48, 42)">
      <text style="font-family:'JetBrains Mono';font-size:11px;letter-spacing:0.18em;fill:#A8A8A6;text-transform:uppercase">RESUMO EXECUTIVO DA MARCA</text>
      <text y="32" style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:20px;fill:#FFFFFF">Salvei: O refúgio digital onde o seu repertório visual ganha clareza e permanência.</text>
      <text y="58" style="font-family:'Inter';font-size:13px;fill:#9CA3AF">Arquitetura de marca aprovada • Direção de Arte de Alta Fidelidade • Brasil (pt-BR) • 2026</text>
    </g>
  </g>
</svg>