<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Salvei Brand Canvas 1200x630 -->
  <rect width="1200" height="630" fill="#090A0F"/>

  <!-- Cobalt Luminous Radial Aura -->
  <radialGradient id="ogAura" cx="15%" cy="25%" r="75%">
    <stop offset="0%" stop-color="#3C3DE3" stop-opacity="0.38"/>
    <stop offset="50%" stop-color="#181B26" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#ogAura)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#272B3B" stroke-width="1" stroke-opacity="0.35">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Border Perimeter Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .og-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #7B7DFF; letter-spacing: 0.16em; text-transform: uppercase; }
    .og-h1 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 58px; fill: #FFFFFF; letter-spacing: -0.04em; line-height: 1.08; }
    .og-sub { font-family: 'Inter', sans-serif; font-size: 20px; fill: #94A3B8; line-height: 1.5; }
    .og-meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; fill: #F8FAFC; letter-spacing: 0.05em; }
  </style>

  <!-- Left Content Group -->
  <g transform="translate(80, 76)">
    <!-- Brand Lockup -->
    <g transform="translate(0, 16)">
      <svg width="42" height="42" viewBox="0 0 120 120" fill="none">
        <defs>
          <linearGradient id="og-logo-blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5E61FF"/>
            <stop offset="100%" stop-color="#4144EA"/>
          </linearGradient>
        </defs>
        <g transform="translate(10, 8)">
          <path d="M 74.4 0.0 L 79.76 0.6 C 84 2 86 6 86 11 L 86 17 C 82 20 78 24 78 32 C 78 37 81 40 85 41 L 76 43 L 26.2 55.8 C 22 57 17 56 13 52 C 8 47 6 42 6 34 L 6 27 C 9 20 16 16 23 14 L 68 2.5 Z" fill="url(#og-logo-blue)"/>
          <path d="M 25.6 104.0 L 20.24 103.4 C 16 102 14 98 14 93 L 14 87 C 18 84 22 80 22 72 C 22 67 19 64 15 63 L 24 61 L 73.8 48.2 C 78 47 83 48 87 52 C 92 57 94 62 94 70 L 94 77 C 91 84 84 88 77 90 L 32 101.5 Z" fill="url(#og-logo-blue)"/>
        </g>
      </svg>
      <text x="56" y="32" style="font-family:'Plus Jakarta Sans';font-weight:800;font-size:36px;letter-spacing:-0.04em;fill:#FFFFFF">salvei</text>
      <rect x="180" y="8" width="168" height="26" rx="6" fill="#3C3DE3" fill-opacity="0.18" stroke="#585BFF" stroke-opacity="0.3"/>
      <text x="194" y="25" class="og-tag">VISUAL WORKSPACE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 140)">
      <text class="og-h1">Capture agora.</text>
      <text y="68" class="og-h1">Organize depois.</text>
      <text y="136" class="og-h1"><tspan fill="#585BFF">Encontre sempre.</tspan></text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 340)">
      <text class="og-sub">A biblioteca visual para guardar, catalogar e reencontrar</text>
      <text y="30" class="og-sub">suas referências de design, produtos e arquitetura web.</text>
    </g>

    <!-- Pill URL -->
    <g transform="translate(0, 430)">
      <rect width="250" height="42" rx="10" fill="#181B26" stroke="#272B3B"/>
      <circle cx="20" cy="21" r="5" fill="#10B981"/>
      <text x="36" y="26" class="og-meta">salvei.design • v2.0</text>
    </g>
  </g>

  <!-- Right Visual Feature (Floating Cards Mockup) -->
  <g transform="translate(710, 110)">
    <!-- Back card -->
    <rect x="60" y="40" width="360" height="230" rx="16" fill="#181B26" stroke="#272B3B" transform="rotate(4 240 155)"/>
    <!-- Front card -->
    <g filter="drop-shadow(0 20px 32px rgba(0,0,0,0.5))">
      <rect x="0" y="80" width="380" height="260" rx="16" fill="#111219" stroke="#3C3DE3" stroke-width="1.5"/>
      <!-- Header of card -->
      <path d="M 0 96 C 0 88 8 80 16 80 L 364 80 C 372 80 380 88 380 96 L 380 200 L 0 200 Z" fill="linear-gradient(135deg, #1A1F36 0%, #0F1222 100%)"/>
      <rect x="18" y="98" width="54" height="20" rx="4" fill="#3C3DE3"/>
      <text x="24" y="112" style="font-family:'JetBrains Mono';font-size:9px;font-weight:700;fill:#FFFFFF">FEATURED</text>
      <!-- Bottom info -->
      <text x="20" y="238" style="font-family:'Outfit';font-size:16px;font-weight:700;fill:#FFFFFF">Design System 2026 Archive</text>
      <text x="20" y="262" style="font-family:'JetBrains Mono';font-size:11px;fill:#64748B">koto.studio • 1440×900 • 4K assets</text>
      <!-- Giant glowing S Mark -->
      <g transform="translate(250, 120) scale(1.1)" opacity="0.95">
        <path d="M 74.4 0.0 L 79.76 0.6 C 84 2 86 6 86 11 L 86 17 C 82 20 78 24 78 32 C 78 37 81 40 85 41 L 76 43 L 26.2 55.8 C 22 57 17 56 13 52 C 8 47 6 42 6 34 L 6 27 C 9 20 16 16 23 14 L 68 2.5 Z" fill="#585BFF"/>
        <path d="M 25.6 104.0 L 20.24 103.4 C 16 102 14 98 14 93 L 14 87 C 18 84 22 80 22 72 C 22 67 19 64 15 63 L 24 61 L 73.8 48.2 C 78 47 83 48 87 52 C 92 57 94 62 94 70 L 94 77 C 91 84 84 88 77 90 L 32 101.5 Z" fill="#585BFF"/>
      </g>
    </g>
  </g>
</svg>